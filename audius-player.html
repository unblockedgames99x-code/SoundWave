<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoundWave · Audius Player</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0b14;--panel:#171321;--panel2:#211a30;--text:#f8f5ff;--muted:#aaa0bb;--accent:#a855f7;--accent2:#ec4899;--line:#ffffff16}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#32135d 0,transparent 35%),linear-gradient(135deg,#0d0b14,#120d1d 60%,#24102e);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .wrap{max-width:1050px;margin:auto;padding:32px 20px 150px}.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:34px}.brand{font-size:25px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,#c084fc,#f472b6);color:transparent;background-clip:text}.tag{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.16em}.search{display:flex;gap:10px;width:100%;max-width:680px}.search input{flex:1;min-width:0;background:#ffffff0d;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--text);outline:0;font-size:16px}.search input:focus{border-color:var(--accent)}button{border:0;border-radius:12px;background:var(--accent);color:white;font-weight:700;padding:0 19px;cursor:pointer}button:hover{filter:brightness(1.15)}button:disabled{opacity:.55;cursor:wait}.hero{display:flex;align-items:end;gap:25px;background:linear-gradient(110deg,#ffffff0f,#ffffff04);border:1px solid var(--line);border-radius:25px;padding:26px;margin-bottom:25px;min-height:220px}.hero img{width:165px;height:165px;object-fit:cover;border-radius:18px;background:#2a2237;box-shadow:0 18px 45px #0008}.hero-copy{min-width:0}.eyebrow{color:#d8b4fe;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}.hero h1{font-size:clamp(26px,5vw,52px);line-height:1.02;margin:10px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hero p{color:var(--muted);margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.section-head h2{margin:0;font-size:20px}.status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.track{display:flex;align-items:center;gap:13px;padding:11px;border-radius:16px;background:#ffffff08;border:1px solid transparent;cursor:pointer;min-width:0}.track:hover{background:#ffffff12;border-color:var(--line)}.track img{width:60px;height:60px;object-fit:cover;border-radius:11px;background:#2a2237;flex:none}.track-info{min-width:0;flex:1}.track-title,.track-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-title{font-weight:750}.track-artist{color:var(--muted);font-size:13px;margin-top:3px}.play{width:38px;height:38px;padding:0;border-radius:50%;font-size:16px;flex:none}.player{position:fixed;bottom:0;left:0;right:0;background:#130f1cee;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:13px 20px}.player-inner{max-width:1050px;margin:auto;display:flex;align-items:center;gap:14px}.mini-art{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#2a2237}.now{min-width:0;flex:1}.now strong,.now span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now span{color:var(--muted);font-size:13px}.controls{display:flex;align-items:center;gap:10px}.controls button{width:42px;height:42px;padding:0;border-radius:50%}.progress{position:absolute;left:0;right:0;top:-2px;height:3px;background:#ffffff1c}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}.empty{grid-column:1/-1;color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:16px}@media(max-width:650px){.wrap{padding:22px 14px 145px}.hero{align-items:center;padding:18px;min-height:0}.hero img{width:110px;height:110px}.hero h1{font-size:26px}.player-inner{gap:9px}.controls{gap:5px}.player{padding:11px 12px}.tag{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div><div class="brand">SoundWave</div><div class="tag">Free music from Audius</div></div><form class="search" id="searchForm"><input id="query" placeholder="Search songs or artists…" autocomplete="off"><button id="searchBtn">Search</button></form></header>
    <section class="hero"><img id="heroArt" alt="Album artwork"><div class="hero-copy"><div class="eyebrow">Now playing</div><h1 id="heroTitle">Choose a track</h1><p id="heroArtist">Search Audius and press play</p></div></section>
    <div class="section-head"><h2>Tracks</h2><span class="status" id="status">Loading music…</span></div>
    <section class="grid" id="results"><div class="empty">Search for a song to get started.</div></section>
  </main>
  <footer class="player"><div class="progress"><i id="progress"></i></div><div class="player-inner"><img class="mini-art" id="miniArt" alt=""><div class="now"><strong id="playerTitle">Nothing playing</strong><span id="playerArtist">Search for a track</span></div><div class="controls"><button id="back" title="Previous">‹</button><button id="toggle" title="Play or pause">▶</button><button id="next" title="Next">›</button></div><audio id="audio" preload="none"></audio></div></footer>
  <script>
    const API='https://api.audius.co/v1', APP='SoundWave';
    const $=id=>document.getElementById(id), audio=$('audio'), state={tracks:[],index:-1};
    const art=t=>t?.artwork?.['480x480']||t?.artwork?.['150x150']||'';
    const artist=t=>t?.user?.name||t?.user?.handle||'Audius artist';
    function setNow(t){const image=art(t);$('heroArt').src=image;$('miniArt').src=image;$('heroTitle').textContent=t.title||'Untitled';$('heroArtist').textContent=artist(t);$('playerTitle').textContent=t.title||'Untitled';$('playerArtist').textContent=artist(t)}
    function playAt(i){const t=state.tracks[i];if(!t)return;state.index=i;setNow(t);audio.src=t.stream?.url||`${API}/tracks/${encodeURIComponent(t.id)}/stream?app_name=${APP}`;audio.play().then(()=>{$('toggle').textContent='❚❚'}).catch(()=>{$('status').textContent='Playback was blocked; press play again.'});render()}
    function render(){const box=$('results');if(!state.tracks.length){box.innerHTML='<div class="empty">No tracks found. Try another search.</div>';return}box.innerHTML=state.tracks.map((t,i)=>`<article class="track" data-i="${i}"><img src="${art(t)}" alt=""><div class="track-info"><div class="track-title">${escapeHtml(t.title||'Untitled')}</div><div class="track-artist">${escapeHtml(artist(t))}</div></div><button class="play" data-play="${i}">${i===state.index&&!audio.paused?'❚❚':'▶'}</button></article>`).join('');box.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(Number(b.dataset.play)===state.index&&!audio.paused){audio.pause()}else playAt(Number(b.dataset.play))});box.querySelectorAll('.track').forEach(el=>el.onclick=()=>playAt(Number(el.dataset.i)))}
    function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function search(q){q=q.trim();if(!q)return;$('searchBtn').disabled=true;$('status').textContent='Searching…';try{const r=await fetch(`${API}/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP}&limit=24`);if(!r.ok)throw Error();const json=await r.json();state.tracks=json.data||[];state.index=-1;render();$('status').textContent=`${state.tracks.length} tracks`; }catch(e){$('status').textContent='Search service unavailable';$('results').innerHTML='<div class="empty">Audius could not be reached. Try again shortly.</div>'}finally{$('searchBtn').disabled=false}}
    $('searchForm').onsubmit=e=>{e.preventDefault();search($('query').value)};$('toggle').onclick=()=>{if(!audio.src&&state.tracks[0])return playAt(0);if(audio.paused){audio.play();$('toggle').textContent='❚❚'}else{audio.pause();$('toggle').textContent='▶'}render()};$('back').onclick=()=>playAt((state.index-1+state.tracks.length)%state.tracks.length);$('next').onclick=()=>playAt((state.index+1)%state.tracks.length);audio.onended=()=>playAt((state.index+1)%state.tracks.length);audio.ontimeupdate=()=>{$('progress').style.width=audio.duration?`${audio.currentTime/audio.duration*100}%`:'0%'};search('electronic');
  </script>
</body>
</html>
